name: Validar documentação AIOS

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "docs/**"
      - "skills/**"
      - "dist/**"
      - "references/**"
      - "scripts/**"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "docs/**"
      - "skills/**"
      - "dist/**"
      - "references/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate-docs:
    name: Verificar integridade da documentação
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v6
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Testar o validador com mutações isoladas
        run: python -m unittest discover -s scripts -p 'test_validate_aios_docs.py' -v
      - name: Validar documentação, pacotes e manifesto
        run: python scripts/validate_aios_docs.py

      - name: Verificar pacotes gerados e inventário
        run: |
          python scripts/build_skill_packages.py --check --zip
          python scripts/build_manifest.py --check
